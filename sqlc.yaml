version: "2"
sql:
  - engine: postgresql
    # sqlc reads the golang-migrate directory as the schema and skips the down migrations.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
